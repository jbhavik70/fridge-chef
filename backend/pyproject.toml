[project]
name = "fridge-chef-backend"
version = "0.1.0"
description = "Fridge to Recipe AI app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "google-genai>=0.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.pytest.ini_options]
pythonpath = ["."]
